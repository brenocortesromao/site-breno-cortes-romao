<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Consistência</title><desc id="d">Site, apresentação, campanhas e redes começam apontando em direções diferentes e se alinham numa mesma direção.</desc>
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b6e73"/><stop offset=".55" stop-color="#b9bcc1"/><stop offset="1" stop-color="#e6e7e9"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd1d4"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="gapfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".09"/>
  </linearGradient>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
</defs>
<g id="pontos">
  <g id="ponto-1" opacity="1">
    <circle cx="260.0" cy="250.0" r="5" fill="#fff"/>
    <line x1="260.0" y1="250.0" x2="353.3" y2="191.7" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="345.8,203.6 353.3,191.7 339.4,193.2" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260.0" y="290.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">SITE</text>
  </g>
  <g id="ponto-2" opacity="1">
    <circle cx="500.0" cy="470.0" r="5" fill="#fff"/>
    <line x1="500.0" y1="470.0" x2="586.7" y2="537.7" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="573.0,534.8 586.7,537.7 580.5,525.2" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500.0" y="448.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">APRESENTAÇÃO</text>
  </g>
  <g id="ponto-3" opacity="1">
    <circle cx="780.0" cy="210.0" r="5" fill="#fff"/>
    <line x1="780.0" y1="210.0" x2="680.3" y2="256.5" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="689.2,245.6 680.3,256.5 694.3,256.7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="780.0" y="188.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">CAMPANHAS</text>
  </g>
  <g id="ponto-4" opacity="1">
    <circle cx="1010.0" cy="450.0" r="5" fill="#fff"/>
    <line x1="1010.0" y1="450.0" x2="1051.2" y2="348.0" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="1052.1,362.0 1051.2,348.0 1040.8,357.4" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1010.0" y="490.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">REDES</text>
  </g>
</g>
<text id="nota" x="1100" y="640" text-anchor="end" fill="#ffffff" fill-opacity=".38" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">ILUSTRATIVO</text>
</svg>
