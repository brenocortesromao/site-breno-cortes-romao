<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Consistência</title><desc id="d">Site, apresentação, campanhas e redes começam apontando em direções diferentes e se alinham numa mesma direção.</desc>
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b6e73"/><stop offset=".55" stop-color="#b9bcc1"/><stop offset="1" stop-color="#e6e7e9"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd1d4"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="gapfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".09"/>
  </linearGradient>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
</defs>
<line id="eixo-comum" x1="140" y1="360" x2="1220" y2="360" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="1220" y="335" text-anchor="end" fill="#ffffff" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">MESMA DIREÇÃO</text>
<g id="pontos">
  <g id="ponto-1" opacity="1">
    <circle cx="220.0" cy="360.0" r="5" fill="#fff"/>
    <line x1="220.0" y1="360.0" x2="330.0" y2="360.0" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="317.4,366.1 330.0,360.0 317.4,353.9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220.0" y="400.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">SITE</text>
  </g>
  <g id="ponto-2" opacity="1">
    <circle cx="480.0" cy="360.0" r="5" fill="#fff"/>
    <line x1="480.0" y1="360.0" x2="590.0" y2="360.0" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="577.4,366.1 590.0,360.0 577.4,353.9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480.0" y="400.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">APRESENTAÇÃO</text>
  </g>
  <g id="ponto-3" opacity="1">
    <circle cx="740.0" cy="360.0" r="5" fill="#fff"/>
    <line x1="740.0" y1="360.0" x2="850.0" y2="360.0" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="837.4,366.1 850.0,360.0 837.4,353.9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="740.0" y="400.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">CAMPANHAS</text>
  </g>
  <g id="ponto-4" opacity="1">
    <circle cx="1000.0" cy="360.0" r="5" fill="#fff"/>
    <line x1="1000.0" y1="360.0" x2="1110.0" y2="360.0" stroke="#f2f3f4" stroke-width="3" stroke-linecap="round"/>
    <polyline points="1097.4,366.1 1110.0,360.0 1097.4,353.9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1000.0" y="400.0" fill="#ffffff" fill-opacity=".7" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">REDES</text>
  </g>
</g>
<text id="nota" x="1100" y="640" text-anchor="end" fill="#ffffff" fill-opacity=".38" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">ILUSTRATIVO</text>
</svg>
