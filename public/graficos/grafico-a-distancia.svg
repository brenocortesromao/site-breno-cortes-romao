<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" fill="none" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A distância</title><desc id="d">Duas curvas: o negócio cresce rápido; a marca cresce devagar e fica para trás. A área entre elas é a distância.</desc>
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6b6e73"/><stop offset=".55" stop-color="#b9bcc1"/><stop offset="1" stop-color="#e6e7e9"/>
  </linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfd1d4"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="gapfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".09"/>
  </linearGradient>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
  </pattern>
</defs>
<g id="eixos" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2">
  <line x1="100" y1="600" x2="1100" y2="600"/><line x1="100" y1="600" x2="100" y2="90"/>
</g>
<g id="rotulos-eixos" fill="#ffffff" fill-opacity=".38" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">
  <text x="100" y="640">TEMPO →</text>
</g>
<path id="area-distancia" d="M100 600 C300 430 650 250 1100 130 L1100 420 C950 480 800 525 600 560 C450 585 300 598 100 600 Z" fill="url(#hatch)"/>
<path id="area-brilho" d="M100 600 C300 430 650 250 1100 130 L1100 420 C950 480 800 525 600 560 C450 585 300 598 100 600 Z" fill="url(#gapfill)"/>
<path id="curva-negocio" d="M100 600 C300 430 650 250 1100 130" stroke="url(#white)" stroke-width="3" stroke-linecap="round"/>
<path id="curva-marca" d="M100 600 C300 598 450 585 600 560 C800 525 950 480 1100 420" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
<g id="rotulos" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">
  <circle cx="1100" cy="130" r="5" fill="#fff"/><text x="1122" y="135" fill="#ffffff">NEGÓCIO</text>
  <circle cx="1100" cy="420" r="5" fill="#b9bcc1"/><text x="1122" y="425" fill="#b9bcc1">MARCA</text>
</g>
<g id="rotulo-distancia">
  <line x1="1060" y1="160" x2="1060" y2="430" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 6"/>
  <line x1="1052" y1="160" x2="1068" y2="160" stroke="#ffffff" stroke-opacity=".55"/><line x1="1052" y1="430" x2="1068" y2="430" stroke="#ffffff" stroke-opacity=".55"/>
  <text x="1040" y="300" text-anchor="end" fill="#ffffff" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">A DISTÂNCIA</text>
</g>
<text id="nota" x="1100" y="640" text-anchor="end" fill="#ffffff" fill-opacity=".38" font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" font-size="15" letter-spacing="3.5">ILUSTRATIVO</text>
</svg>
